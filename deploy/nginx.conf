# Example nginx configuration for OpenTour. Replace example.com with your own domain
# and adjust the paths. The game ships no CA store and libs2pcore does no certificate
# pinning, so a plain Let's Encrypt certificate works.
#
#   sudo certbot certonly --nginx -d booster.example.com -d realtime.example.com

upstream opentour_booster {
    server 127.0.0.1:18084;
    keepalive 16;
}

server {
    listen 80;
    server_name booster.example.com;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    server_name booster.example.com;

    ssl_certificate     /etc/letsencrypt/live/booster.example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/booster.example.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;
    ssl_prefer_server_ciphers on;

    client_max_body_size 32m;

    # Asset CDN mirror: files produced by tools/fetch_resources.py, served flat. Pack names
    # carry a content hash, so they are immutable.
    location /cdn/ {
        alias /srv/opentour/resources/cdn/;
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    location /baas/ {
        rewrite ^/baas/(.*)$ /$1 break;
        proxy_pass http://opentour_booster;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header Connection "";
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
    }

    location /support/ {
        rewrite ^/support/(.*)$ /$1 break;
        proxy_pass http://opentour_booster;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header Connection "";
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Sakasho API lives at the root: the client posts to / and the real path travels inside
    # the encrypted body.
    location / {
        proxy_pass http://opentour_booster;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header Connection "";
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
    }
}

# Realtime (Izumo) matchmaking. Plain TCP on 11401, forwarded to tools/izumo_listen.py with a
# PROXY protocol header so it learns each player's real address. Put this in the top-level
# `stream {}` block of nginx.conf.
#
# stream {
#     server {
#         listen 11401;
#         proxy_protocol on;
#         proxy_pass 127.0.0.1:18401;
#     }
# }
